<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year Offer</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">


</head>
<body>
    <!-- Banner-section-start -->
        <section class="parent-banner container child-banner-image ">
            <div class="child-banner-text">
                <h3>Happy New Year</h3>
                <p class="banner-subtitle">New Year Party</p>
                <p class="banner-subtitle">Celebration</p>
            </div>
       </section>
       <!-- banner-section-end -->

       <!-- 65%-off-section-start -->

       <section class="parent-offer container">
        <div class="child-offer-text">
            <h1 class="offer-title">65% OFF</h1>
            <p class="offer-text-top">OUR HOLIDAY DEALS ARE BETTER</p>
            <p class="offer-text-bottom">ALL CATEGORIES</p>
        </div>
        <div class="child-offer-image">
            <img src="./images/New Year Photo.png" alt="offer-image">
        </div>

       </section>
    </body>
</html>
